<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PR Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#0A0A0A;--surface:#161616;--surface-2:#1F1F1F;--border:#2C2C2C;
  --text:#FFFFFF;--muted:#8F8F8F;--accent:#E4002B;--accent-dim:#3D0912;--warn:#FFB020;
  --display:"Oswald","Arial Narrow",sans-serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.stripe{height:4px;background:var(--accent)}
header{padding:18px 18px 0;display:flex;flex-direction:column;gap:14px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{margin:2px 0 0;font-size:40px;font-weight:900;line-height:1;letter-spacing:.02em}
.loc{position:relative}
.loc select{appearance:none;-webkit-appearance:none;background:var(--surface);color:var(--text);border:1.5px solid var(--accent);border-radius:6px;padding:8px 30px 8px 30px;font:600 13px var(--body);cursor:pointer}
.loc:before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;transform:translateY(-58%);background:var(--accent);border-radius:50% 50% 50% 0;rotate:-45deg}
.loc:after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px}
.search svg{flex:none;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:14px var(--body);outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:none}
.search:focus-within{border-color:var(--accent)}
main{flex:1;padding:6px 18px 96px;display:flex;flex-direction:column;gap:22px}
.group h2{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.group h2:before{content:"";width:4px;height:16px;background:var(--accent)}
.group h2 small{font-family:var(--display);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
.row{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.name{font-weight:500;font-size:14px;text-wrap:balance}
.name .part{font-family:var(--display);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-right:6px;padding:1px 5px;border:1px solid var(--border);border-radius:3px;vertical-align:1px}
.name .flag{margin-left:6px;font-size:12px}
.sets{margin-top:3px;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.sets b{font-weight:500;color:var(--warn)}
.w{font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent);letter-spacing:.01em;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.w small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.w.zero{font-size:14px;color:var(--muted);font-weight:500}
.detail{grid-column:1/-1;display:none;padding:10px 12px 2px;font-size:13px;color:var(--muted)}
.detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.detail dt{font-family:var(--display);letter-spacing:.06em;font-size:11px;color:var(--accent);text-transform:uppercase;padding-top:2px}
.detail dd{margin:0;color:var(--text)}
.row.open .detail{display:block}
.row.open{background:linear-gradient(90deg,var(--accent-dim),transparent 60%);margin:0 -18px;padding-left:18px;padding-right:18px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.tabs{max-width:448px;margin:0 auto;height:56px;padding:6px;display:flex;gap:2px;background:rgba(22,22,22,.9);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);pointer-events:auto}
.tab{flex:1;border:0;background:none;color:var(--muted);border-radius:6px;font:400 11px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.tab .n{font-family:var(--display);font-size:15px;font-weight:500;letter-spacing:.04em;line-height:1}
.tab.on{background:var(--accent);color:#fff;font-weight:600}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-2px}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
<div class="app">
  <div class="stripe"></div>
  <header>
    <div class="hrow">
      <div><div class="eyebrow" id="eyebrow">PR BOARD</div><h1 id="title">背</h1></div>
      <div class="loc"><select id="loc" aria-label="地點"></select></div>
    </div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜尋動作，例如「窄握」" autocomplete="off"></label>
  </header>
  <main id="main"></main>
  <nav><div class="tabs" id="tabs"></div></nav>
</div>
<script id="data" type="application/json">
__DATA__
</script>
<script>
const DB=JSON.parse(document.getElementById('data').textContent);
const PARTS=["胸","背","腿","肩","手臂","核心"];
const EQ_ORDER=["槓片","插銷","滑輪","繩帶","自由重量","自重"];
const LOCS=["台北","台中","美村店","學府"];
let part="背",loc="",q="",openId=null;
try{part=localStorage.getItem('pb.part')||part;loc=localStorage.getItem('pb.loc')||loc;}catch(e){}
if(!PARTS.includes(part))part="背";
const $=s=>document.querySelector(s);
const tabs=$('#tabs'),main=$('#main'),sel=$('#loc');
sel.innerHTML='<option value="">全部地點</option>'+LOCS.map(l=>`<option value="${l}">${l}</option>`).join('');
sel.value=loc;
$('#eyebrow').textContent='PR BOARD · 更新 '+DB.updated.slice(5).replace('-','/');
PARTS.forEach(p=>{const b=document.createElement('button');b.className='tab';b.innerHTML=`<span class="n">${count(p)}</span>${p}`;b.onclick=()=>{part=p;q="";$('#q').value="";save();render();};tabs.appendChild(b);});
sel.onchange=()=>{loc=sel.value;save();render();};
$('#q').oninput=e=>{q=e.target.value.trim();render();};
function save(){try{localStorage.setItem('pb.part',part);localStorage.setItem('pb.loc',loc);}catch(e){}}
function count(p){return DB.items.filter(i=>i.part===p&&(!loc||!i.location||i.location===loc)).length}
function fmtDate(i){if(!i.date)return"—";const d=i.date.slice(5).replace('-','/');return(i.dateApprox?"約 ":"")+d}
function fmtW(i){if(i.weight===null)return'<span class="w zero">未測</span>';if(i.weight===0)return'<span class="w zero">'+(i.equipment==="自重"?"自重":"空槓")+'</span>';return`<span class="w">${i.weight}<small>kg</small></span>`}
function fmtSets(s){return s?s.replace(/(\d+)F/g,'<b>$1F</b>'):'<span style="opacity:.5">—</span>'}
function render(){
  const searching=q.length>0;
  const list=DB.items.filter(i=>(searching?i.name.includes(q):i.part===part)&&(!loc||!i.location||i.location===loc));
  $('#title').textContent=searching?`「${q}」`:part;
  [...tabs.children].forEach((b,k)=>{b.classList.toggle('on',!searching&&PARTS[k]===part);b.querySelector('.n').textContent=count(PARTS[k]);});
  if(!list.length){main.innerHTML='<div class="empty">這個組合沒有紀錄</div>';return;}
  const groups=new Map();list.forEach(i=>{const k=i.equipment;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i);});
  main.innerHTML=[...groups.entries()].sort((a,b)=>EQ_ORDER.indexOf(a[0])-EQ_ORDER.indexOf(b[0])).map(([eq,items])=>`
    <section class="group"><h2>${eq}<small>${items.length} 個</small></h2>${items.map(row).join('')}</section>`).join('');
  main.querySelectorAll('.row').forEach(r=>{r.onclick=()=>{openId=openId===r.dataset.id?null:r.dataset.id;render();};r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();r.click();}}});
}
function row(i){
  const id=i.part+i.location+i.name;
  const locTxt=i.location||"不分地點";
  return`<div class="row${openId===id?' open':''}" data-id="${id}" tabindex="0">
    <div><div class="name">${q?`<span class="part">${i.part}</span>`:''}${i.name}${i.flag?`<span class="flag">${i.flag}</span>`:''}</div>
    <div class="sets">${fmtSets(i.sets)}${loc?'':' · '+locTxt}</div></div>
    ${fmtW(i)}
    <div class="detail"><dl>
      <dt>下次</dt><dd>${i.next||"—"}</dd>
      ${i.note?`<dt>備註</dt><dd>${i.note}</dd>`:''}
      <dt>地點</dt><dd>${locTxt}</dd>
      <dt>記錄</dt><dd>${fmtDate(i)}</dd>
    </dl></div></div>`;
}
render();
</script>
